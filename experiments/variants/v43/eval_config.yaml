# Per-task budgets. The scorer runs ~120 hidden tasks SEQUENTIALLY under a hard 12 h cap that currently fails the
# whole submission when exceeded (organizer, discussion 743063), and reads only these four fields.
# Measured: on 4x L4 (organizers' notebook) and on our T4 runs almost every task uses its full time budget, plus
# ~25 s sandbox setup and ~8 s verification on our T4 runs. Day 3 (5.5 min) FAILED with "Notebook Exceeded Allowed
# Compute", so real scorer overhead is at least ~0.5 min/task and unknown above that; 3.5 min keeps 120 tasks at
# ~11 h even with 2 min of overhead per task. Day 4 at 3.5 min scored 0.06 and finished in ~7.5 h, so day 5
# steps up to 4.5 min (estimated ~9.6 h if runtime scales with the cap).
# timeout_seconds also bounds the hidden-test pytest run in verification, so keep it >= 180.
evaluation:
  timeout_seconds: 180
  max_tool_calls: 30
  max_time_minutes: 4.5
  max_turns: 60
